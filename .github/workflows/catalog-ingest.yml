name: Catalog ingest (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to ingest
        required: true
        type: choice
        options:
          - winemag-d1
          - vivc-popular
          - inao-geo

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VIVC tooling
        if: inputs.target == 'vivc-popular'
        run: pip install vivcpy

      - name: Generate popular grapes JSON
        if: inputs.target == 'vivc-popular'
        run: python scripts/catalog/ingest-vivc.py --popular-only

      - name: Upload popular grapes artifact
        if: inputs.target == 'vivc-popular'
        uses: actions/upload-artifact@v4
        with:
          name: grapes-popular
          path: composeApp/src/commonMain/composeResources/files/grapes-popular.json

      - name: WineMag D1 ingest
        if: inputs.target == 'winemag-d1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WINEMAG_CSV_PATH: ${{ secrets.WINEMAG_CSV_PATH }}
        run: |
          echo "Download winemag CSV to scripts/catalog/data/ and configure D1 in worker/wrangler.jsonc before running ingest-winemag.py"
          pip install csv
          test -f scripts/catalog/data/winemag-data-130k-v2.csv || exit 1
          npm ci --prefix worker
          python scripts/catalog/ingest-winemag.py

      - name: Install GDAL for INAO geo ingest
        if: inputs.target == 'inao-geo'
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Build appellations map pack
        if: inputs.target == 'inao-geo'
        run: |
          test -f scripts/catalog/data/parcellaire.shp || { echo "Missing scripts/catalog/data/parcellaire.shp — download INAO shapefile first"; exit 1; }
          python scripts/catalog/ingest-inao-geo.py --shp scripts/catalog/data/parcellaire.shp

      - name: Upload map pack to R2
        if: inputs.target == 'inao-geo'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --prefix worker
          npx --prefix worker wrangler r2 object put vincent-map-pack/appellations-map-fr.zip \
            --file scripts/catalog/out/appellations-map-fr.zip
